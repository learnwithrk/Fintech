<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Read — FinTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#1c2333;font:17px/1.7 Lora,Georgia,serif;-webkit-user-select:none;user-select:none}
.bar{position:sticky;top:0;z-index:5;background:#1a4b8c;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;font:600 15px Inter,sans-serif}
.bar a{color:#fff;text-decoration:none;white-space:nowrap}.bar .t{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{display:none;background:none;border:1px solid #fff8;color:#fff;border-radius:6px;padding:4px 10px;font-size:16px}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:26px;max-width:1100px;margin:0 auto;padding:20px 16px}
.toc{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid #dde2ec;border-radius:10px;padding:12px;font:14px Inter,sans-serif}
.toc b{display:block;margin:10px 0 4px;color:#1a4b8c}.toc b:first-child{margin-top:0}
.toc a{display:block;padding:4px 7px;border-radius:5px;color:inherit;text-decoration:none}.toc a:hover,.toc a.on{background:#e8f0fb}
article{background:#fff;border:1px solid #dde2ec;border-radius:12px;padding:24px;min-width:0}
.eb{font:600 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#667}
h1{margin:4px 0 8px;font-size:28px}h3{font:700 19px Inter,sans-serif;margin:26px 0 4px;color:#1a4b8c;scroll-margin-top:70px}
.obj{font:14px Inter,sans-serif;color:#667}.ex{background:#e8f0fb;border-left:4px solid #1a4b8c;padding:8px 12px;border-radius:6px;margin:10px 0}
table{border-collapse:collapse;width:100%;font:14px Inter,sans-serif;display:block;overflow-x:auto}th,td{border:1px solid #dde2ec;padding:6px 9px;text-align:left}th{background:#e8f0fb}
.pager{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:30px;font:600 14px Inter,sans-serif}
.btn{padding:9px 14px;border-radius:8px;border:1px solid #1a4b8c;color:#1a4b8c;text-decoration:none;background:#fff}.btn.p{background:#1a4b8c;color:#fff}
@media(max-width:820px){.bar button{display:block}.wrap{grid-template-columns:1fr;padding:12px}.toc{display:none;position:static;max-height:none}.toc.open{display:block}article{padding:16px}}
</style>
</head>
<body>
<div class="bar"><a href="index.html">← All modules</a><div class="t" id="bt">FinTech</div><button id="mb" type="button">☰</button></div>
<div class="wrap">
<aside class="toc" id="toc">Loading…</aside>
<article>
<div class="eb" id="eb"></div><h1 id="ttl">Loading…</h1><div id="body"></div><div class="pager" id="pager"></div>
</article>
</div>
<script>
(async function(){
var $=function(i){return document.getElementById(i)};
$("mb").onclick=function(){$("toc").classList.toggle("open")};
try{
var mods=await (await fetch("content/modules.json")).json();
var p=new URLSearchParams(location.search),id=p.get("id")||"";
var i=mods.findIndex(function(m){return m.id===id});
if(i<0&&p.get("m"))i=(parseInt(p.get("m"))||1)-1;
if(i<0)i=0;
var m=mods[i];
document.title="Read — "+m.title;
$("bt").textContent=m.title;$("eb").textContent="Module "+m.num;$("ttl").textContent=m.title;
$("body").innerHTML=await (await fetch(m.file)).text();
var hs=[].slice.call($("body").querySelectorAll("h3"));
hs.forEach(function(h,k){h.id="t"+k});
$("toc").innerHTML="<b>Topics in this module</b>"+hs.map(function(h,k){return '<a href="#t'+k+'">'+h.textContent+'</a>'}).join("")
+"<b>All modules</b>"+mods.map(function(x,k){return '<a class="'+(k===i?'on':'')+'" href="read.html?id='+x.id+'">'+x.num+'. '+x.title+'</a>'}).join("");
$("toc").addEventListener("click",function(e){if(e.target.tagName==="A")$("toc").classList.remove("open")});
var prev=mods[i-1],next=mods[i+1];
$("pager").innerHTML=(prev?'<a class="btn" href="read.html?id='+prev.id+'">← '+prev.title+'</a>':'<a class="btn" href="index.html">← All modules</a>')
+'<a class="btn p" href="quiz.html?id='+m.quiz+'">Take the Module '+m.num+' Quiz</a>'
+(next?'<a class="btn" href="read.html?id='+next.id+'">'+next.title+' →</a>':'<a class="btn" href="index.html">All modules →</a>');
}catch(e){
$("ttl").textContent="Couldn't load this module";
$("body").innerHTML="<p>"+e.message+". Check that content/modules.json and the content/ folder are uploaded.</p>";
$("toc").textContent="";
}
})();
document.addEventListener("contextmenu",function(e){e.preventDefault()});
</script>
</body>
</html>
